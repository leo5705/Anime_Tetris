<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ДИНАСТИЯ БЕЗУМИЕ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: linear-gradient(45deg, #ff0000, #ff6600, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff);
            background-size: 400% 400%;
            animation: rainbow 2s ease infinite;
            font-family: 'Arial Black', sans-serif;
        }
        
        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .timer {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 48px;
            color: white;
            text-shadow: 0 0 20px black;
            z-index: 1000;
        }
        
        .anime-girl {
            position: absolute;
            font-size: 80px;
            cursor: pointer;
            transition: all 0.1s;
            z-index: 100;
        }
        
        .shouting-text {
            position: absolute;
            font-size: 60px;
            color: red;
            text-shadow: 0 0 30px yellow;
            animation: shake 0.1s infinite;
            z-index: 101;
            white-space: nowrap;
        }
        
        @keyframes shake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-10px, -10px) rotate(-5deg); }
            75% { transform: translate(10px, 10px) rotate(5deg); }
        }
        
        .gun-anime {
            position: absolute;
            font-size: 60px;
            z-index: 90;
        }
        
        .bullet {
            position: absolute;
            width: 20px;
            height: 10px;
            background: yellow;
            border-radius: 5px;
            z-index: 80;
            box-shadow: 0 0 10px orange;
        }
        
        .lyrics {
            position: fixed;
            font-size: 40px;
            color: white;
            text-shadow: 0 0 20px black;
            text-align: center;
            z-index: 1000;
            animation: flash 0.2s infinite;
        }
        
        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .explosion {
            position: absolute;
            font-size: 100px;
            z-index: 95;
            animation: explode 0.5s ease-out forwards;
        }
        
        @keyframes explode {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }
        
        .crazy-mode {
            animation: crazyBg 0.1s infinite;
        }
        
        @keyframes crazyBg {
            0%, 100% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(180deg); }
        }
    </style>
</head>
<body>
    <div class="timer" id="timer">0:00</div>
    
    <script>
        let seconds = 0;
        let chaosMode = false;
        let animeGirls = [];
        let gunAnimes = [];
        let bullets = [];
        
        const lyricsLines = [
            "ПЕРВЫЙ МИЛИОН!",
            "Я ПЕРВЫЙ ЧЕМПИОН!",
            "ЛЮБЛЮ МОСКВУ!",
            "НО ЗАЕБАЛИ ВСЕ!",
            "МОСКОВСКИЕ ШАЛАВЫ!",
            "ДИНАСТИЯЯЯЯЯЯЯ!",
            "БЕЗУМИЕ!",
            "ЧИЛИ!"
        ];
        
        function updateTimer() {
            seconds++;
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            document.getElementById('timer').textContent = 
                `${mins}:${secs.toString().padStart(2, '0')}`;
            
            // Начинаем безумие на 1:03 (63 секунды)
            if (seconds >= 63 && !chaosMode) {
                startChaos();
            }
            
            if (chaosMode) {
                createChaos();
            }
        }
        
        function startChaos() {
            chaosMode = true;
            document.body.classList.add('crazy-mode');
            
            // Создаем главную аниме тян
            createMainAnimeGirl();
            
            // Показываем текст песни
            showLyrics();
        }
        
        function createMainAnimeGirl() {
            const girl = document.createElement('div');
            girl.className = 'anime-girl';
            girl.textContent = '👧';
            girl.style.left = '50%';
            girl.style.top = '50%';
            document.body.appendChild(girl);
            animeGirls.push({ element: girl, x: 50, y: 50, vx: 10, vy: 10 });
            
            // Текст крика
            const shout = document.createElement('div');
            shout.className = 'shouting-text';
            shout.textContent = 'ДИНАСТИЯЯЯЯЯЯЯ';
            shout.style.left = '50%';
            shout.style.top = '40%';
            document.body.appendChild(shout);
        }
        
        function showLyrics() {
            let lyricIndex = 0;
            setInterval(() => {
                const lyrics = document.createElement('div');
                lyrics.className = 'lyrics';
                lyrics.textContent = lyricsLines[lyricIndex % lyricsLines.length];
                lyrics.style.left = Math.random() * 80 + 10 + '%';
                lyrics.style.top = Math.random() * 80 + 10 + '%';
                lyrics.style.fontSize = (40 + Math.random() * 60) + 'px';
                document.body.appendChild(lyrics);
                
                setTimeout(() => lyrics.remove(), 2000);
                lyricIndex++;
            }, 800);
        }
        
        function createChaos() {
            // Двигаем главную аниме тян
            animeGirls.forEach((girl, index) => {
                girl.x += girl.vx;
                girl.y += girl.vy;
                
                // Отскок от стен
                if (girl.x <= 0 || girl.x >= window.innerWidth - 100) girl.vx *= -1;
                if (girl.y <= 0 || girl.y >= window.innerHeight - 100) girl.vy *= -1;
                
                girl.element.style.left = girl.x + 'px';
                girl.element.style.top = girl.y + 'px';
                
                // Увеличиваем размер
                const currentSize = parseInt(getComputedStyle(girl.element).fontSize);
                if (currentSize < 200) {
                    girl.element.style.fontSize = (currentSize + 2) + 'px';
                }
            });
            
            // Добавляем новых аниме тян
            if (Math.random() < 0.1) {
                const newGirl = document.createElement('div');
                newGirl.className = 'anime-girl';
                newGirl.textContent = ['👧', '👸', '💃', '🤸‍♀️'][Math.floor(Math.random() * 4)];
                newGirl.style.left = Math.random() * window.innerWidth + 'px';
                newGirl.style.top = Math.random() * window.innerHeight + 'px';
                newGirl.style.fontSize = (80 + Math.random() * 100) + 'px';
                document.body.appendChild(newGirl);
                
                animeGirls.push({
                    element: newGirl,
                    x: parseFloat(newGirl.style.left),
                    y: parseFloat(newGirl.style.top),
                    vx: (Math.random() - 0.5) * 20,
                    vy: (Math.random() - 0.5) * 20
                });
            }
            
            // Добавляем анимешек с автоматами
            if (Math.random() < 0.15) {
                const gunAnime = document.createElement('div');
                gunAnime.className = 'gun-anime';
                gunAnime.textContent = ['👮', '🕵️', '🦸', '🦹'][Math.floor(Math.random() * 4)];
                gunAnime.style.left = Math.random() * window.innerWidth + 'px';
                gunAnime.style.top = Math.random() * window.innerHeight + 'px';
                gunAnime.style.fontSize = (60 + Math.random() * 80) + 'px';
                document.body.appendChild(gunAnime);
                
                gunAnimes.push({
                    element: gunAnime,
                    x: parseFloat(gunAnime.style.left),
                    y: parseFloat(gunAnime.style.top),
                    angle: Math.random() * Math.PI * 2
                });
            }
            
            // Стрельба из автоматов
            gunAnimes.forEach(gun => {
                if (Math.random() < 0.3) {
                    fireBullet(gun);
                }
            });
            
            // Двигаем пули
            bullets.forEach((bullet, index) => {
                bullet.x += bullet.vx;
                bullet.y += bullet.vy;
                bullet.element.style.left = bullet.x + 'px';
                bullet.element.style.top = bullet.y + 'px';
                
                // Удаляем пули за экраном
                if (bullet.x < 0 || bullet.x > window.innerWidth || 
                    bullet.y < 0 || bullet.y > window.innerHeight) {
                    bullet.element.remove();
                    bullets.splice(index, 1);
                }
            });
            
            // Взрывы
            if (Math.random() < 0.05) {
                const explosion = document.createElement('div');
                explosion.className = 'explosion';
                explosion.textContent = '💥';
                explosion.style.left = Math.random() * window.innerWidth + 'px';
                explosion.style.top = Math.random() * window.innerHeight + 'px';
                document.body.appendChild(explosion);
                
                setTimeout(() => explosion.remove(), 500);
            }
        }
        
        function fireBullet(gun) {
            const bullet = document.createElement('div');
            bullet.className = 'bullet';
            bullet.style.left = gun.x + 'px';
            bullet.style.top = gun.y + 'px';
            document.body.appendChild(bullet);
            
            const angle = gun.angle + (Math.random() - 0.5);
            const speed = 15 + Math.random() * 20;
            
            bullets.push({
                element: bullet,
                x: gun.x,
                y: gun.y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed
            });
        }
        
        // Запускаем таймер
        setInterval(updateTimer, 1000);
    </script>
</body>
</html>
